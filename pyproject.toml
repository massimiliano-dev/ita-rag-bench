[project]
name = "ita-rag-bench"
version = "0.1.0"
description = "End-to-end RAG benchmark on real Italian domain documents: PDF parsing, chunking, embedding and retrieval."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Massimiliano Polce" }]
requires-python = ">=3.12,<3.13"
keywords = ["rag", "retrieval", "benchmark", "italian", "nlp", "pdf"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Natural Language :: Italian",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "bm25s>=0.2.13",
    "numpy>=2.1",
    "pypdf>=6.1",
    "pystemmer>=2.2",
    "pyyaml>=6.0.2",
    "typer>=0.17",
]

[project.optional-dependencies]
# PyMuPDF is AGPL-3.0: kept optional so the default install stays MIT-compatible.
pymupdf = ["pymupdf>=1.26"]
docling = ["docling>=2.50"]
embeddings = ["sentence-transformers>=5.1", "torch>=2.8"]

[project.scripts]
itarag = "itaragbench.cli:app"

[project.urls]
Homepage = "https://github.com/massimiliano-dev/ita-rag-bench"
Issues = "https://github.com/massimiliano-dev/ita-rag-bench/issues"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "ruff>=0.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "itaragbench"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
"src/itaragbench/site.py" = ["E501"]  # embedded HTML/JS template

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["itaragbench"]

[[tool.mypy.overrides]]
module = [
    "bm25s.*", "Stemmer", "fitz.*", "pymupdf.*", "pypdfium2.*", "docling.*",
    "sentence_transformers.*", "torch.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# optional heavy backends have no (or partial) type information
module = ["itaragbench.parsing.backends"]
disallow_untyped_calls = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
