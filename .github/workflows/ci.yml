name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      # Light install only: no [docling], [pymupdf] or [embeddings] extras, no model downloads.
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Validate dataset schema
        run: uv run itarag dataset validate --no-check-evidence

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
      # Audits the whole lock file, optional extras included, without installing them.
      - name: Export locked requirements
        run: uv export --locked --format requirements-txt --all-extras --no-emit-project -o requirements-audit.txt
      - name: pip-audit
        run: uv run --only-group dev pip-audit -r requirements-audit.txt --disable-pip --progress-spinner off
